# Server Configuration 
server:
  port: 8080
  tomcat:
    threads:
      max: 400
      min-spare: 100
    connection-timeout: 20000

# Spring Application
spring:
  application:
    name: chatflow-server

  # WebSocket Configuration
  websocket:
    message-size-limit: 64KB
    send-buffer-size-limit: 512KB


  datasource:
    url: jdbc:postgresql://172.31.19.82:5432/chatflow
    username: chatflow
    password: chatflow123
    driver-class-name: org.postgresql.Driver
    hikari:
      # server-v2 only uses DB for Metrics API (low frequency)
      # 10 connections is more than sufficient
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000      # ms: fail fast if DB unreachable
      idle-timeout: 600000          # ms: 10 min before idle connection closed
      max-lifetime: 1800000         # ms: 30 min max connection lifetime


  jpa:
    hibernate:
      # validate: JPA checks that MessageEntity matches schema.sql on startup
      # Never use 'create' or 'update' — schema is managed by schema.sql
      ddl-auto: validate
    show-sql: false                 # set to true temporarily for query debugging
    open-in-view: false             # disable OSIV to avoid lazy loading issues
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC            # ensure TIMESTAMPTZ reads correctly as UTC

# Logging Configuration
logging:
  level:
    root: INFO
    com.chatflow: DEBUG
    org.springframework.web.socket: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
  file:
    name: logs/chatflow-server.log
    max-size: 10MB
    max-history: 10

# Management Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# RabbitMQ Configuration (已有，保持不变)
rabbitmq:
  host: 172.31.18.27
  port: 5672
  username: chatflow
  password: chatflow123
  exchange: chat.exchange
  queue-count: 20
  channel-pool-size: 16
  consumer-thread-count: 10
  consumer-prefetch: 50

# Circuit Breaker Configuration 
circuit-breaker:
  failure-threshold: 5
  reset-timeout-ms: 30000

